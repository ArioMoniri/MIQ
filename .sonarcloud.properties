# SonarCloud automatic analysis: tell it which folders are product code and
# which are tests, so test-only rules apply to Tests/ and coverage/duplication
# figures are computed on the shipped code.
sonar.sources=Sources,MIQApp,MIQQuickLookExtension,MIQThumbnailExtension,MIQSpotlightImporter,scripts,docs
sonar.tests=Tests
# Generated assets (rendered animations, test fixtures written by scripts).
sonar.exclusions=docs/lottie/**
